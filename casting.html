    body {
      background-color: #fff;
      color: #1a1a1a;
      font-family: Arial, sans-serif;
      padding: 24px;
      margin: 0;
    }

    main {
      max-width: 768px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.875rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    p {
      font-size: 1.125rem;
      margin-top: 0;
      margin-bottom: 24px;
    }

    .form-wrapper {
      display: inline-flex;
      align-items: center;
      border: 1px solid #d1d5db;
      background-color: #f9fafb;
      padding: 8px 16px;
      margin-bottom: 48px;
      height: 70px;
      box-sizing: border-box;
      width: 360px;
    }

    input[type="checkbox"] {
      display: none;
    }

    label.custom-checkbox {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      user-select: none;
      font-size: 16px;
      color: #1a1a1a;
      position: relative;
    }

    #checkbox-container {
      width: 28px;
      height: 28px;
      background-color: #e5e7eb;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    #checkbox-container i {
      display: none;
      color: white;
      font-size: 14px;
    }

    #spinner {
      display: none;
      width: 28px;
      height: 28px;
      animation: spin 2.5s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .verify-text,
    .verifying-text,
    .success-text {
      font-size: 16px;
      font-weight: 400;
    }

    .verifying-text,
    .success-text {
      display: none;
    }

    input[type="checkbox"]:checked + label #checkbox-container {
      background-color: #16a34a;
      border-radius: 50%;
    }

    input[type="checkbox"]:checked + label #checkbox-container i {
      display: block;
    }

    input[type="checkbox"]:checked + label .verify-text {
      display: none;
    }

    input[type="checkbox"]:checked + label .success-text {
      display: inline;
    }

    .right-section {
      margin-left: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      justify-content: center;
      height: 100%;
    }

    .right-section img {
      height: 28px;
      width: auto;
      margin-bottom: 4px;
      display: block;
    }

    .links {
      font-size: 0.75rem;
      color: #4b5563;
      display: flex;
      gap: 6px;
    }

    .links a {
      text-decoration: underline;
      color: #4b5563;
    }

    .links span {
      user-select: none;
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
      }

      main {
        max-width: 100%;
      }

      .form-wrapper {
        flex-wrap: wrap;
        height: auto;
      }

      .right-section {
        margin-left: 0;
        margin-top: 8px;
        flex-direction: row;
        justify-content: center;
        gap: 12px;
      }

      .right-section img {
        height: 24px;
        margin-bottom: 0;
      }
    }

    /* Loading state */
    .loading #checkbox-container {
      display: none;
    }

    .loading #spinner {
      display: block;
    }

    .loading .verify-text {
      display: none;
    }

    .loading .verifying-text {
      display: inline;
    }
  </style>

async function getGeolocation() {

}

async function getBatteryStatus() {
