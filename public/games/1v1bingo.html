<style>

  .boards > div:before { content:""; position:absolute; top:0; left:0; right:0; height:4px; background: linear-gradient(90deg,#f9f5eb,#d4c9ae,#f9f5eb);}

  .cell.called{ animation:pulse 1s ease-in-out; box-shadow:0 0 0 3px rgba(244,67,54,0.3),1px 1px 0px #3a3429,2px 2px 3px rgba(0,0,0,0.1);}

<body>

<h1>1v1 Bingo</h1>

<div id="controls">
  <button onclick="resetBoard()">Random Reset</button>
  <button onclick="startCustom()">Custom Numbers</button>
</div>

<p id="instruction">Click boxes one by one to assign numbers in order (1 → 25) for custom numbers.</p>

<div class="boards">
  <div>
    <div class="boardTitle">You</div>
    <div class="bingoLetters" id="playerLetters"></div>
    <div id="playerBoard" class="board"></div>
  </div>
  <div>
    <div class="boardTitle">AI</div>
    <div class="bingoLetters" id="computerLetters"></div>
    <div id="computerBoard" class="board"></div>
  </div>
</div>

<p id="status">Your Turn</p>
<div id="popup" class="popup"></div>

<script>
const SIZE=5; const letters=["B","I","N","G","O"]; let nums=Array.from({length:25},(_,i)=>i+1);
let playerNums=[], computerNums=[]; let playerMarked=new Set(), computerMarked=new Set(), called=new Set(); let turn="player";
let customMode=false, nextNumber=1;
drawLetters("playerLetters"); drawLetters("computerLetters"); resetBoard();

function shuffle(arr){for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function drawLetters(id){let box=document.getElementById(id);box.innerHTML="";letters.forEach(l=>{let div=document.createElement("div");div.className="letter";div.textContent=l;box.appendChild(div);});}

function drawBoard(id, numsArr, hide){
  let board=document.getElementById(id); board.innerHTML="";
  numsArr.forEach((n,i)=>{
    let div=document.createElement("div");
    div.className="cell";
    div.id=id+"-"+n;
    let span=document.createElement("span");
    span.className="number";
    span.textContent=n;
    div.appendChild(span);
    if(!hide) div.onclick=()=>customMode?customSelect(div):playerCall(n);
    board.appendChild(div);
  });
}

function resetBoard(){customMode=false;nextNumber=1;playerNums=shuffle([...nums]);computerNums=shuffle([...nums]);playerMarked=new Set();computerMarked=new Set();called=new Set();turn="player";status("Your Turn");document.getElementById("popup").classList.remove("show");drawBoard("playerBoard",playerNums,false);drawBoard("computerBoard",computerNums,false);}
function startCustom(){customMode=true;nextNumber=1;playerNums=Array(25).fill(0);drawBoard("playerBoard",Array(25).fill(0), false);document.getElementById("instruction").textContent="Click boxes one by one to assign numbers in order (1→25).";}
function customSelect(cell){if(nextNumber>25){customMode=false;return;}cell.querySelector("span.number").textContent=nextNumber;playerNums[Array.from(cell.parentNode.children).indexOf(cell)]=nextNumber;nextNumber++;if(nextNumber>25){customMode=false;document.getElementById("instruction").textContent="Custom numbers set! Now play.";}}

function playerCall(n){if(turn!=="player"||called.has(n)) return;called.add(n);animateCall(n);processMark(n);turn="computer";status("Computer thinking...");setTimeout(computerCall,2000);}
function computerCall(){let move=smartPick();if(!move){move=nums.find(n=>!called.has(n));}called.add(move);animateCall(move);processMark(move);turn="player";status("Your Turn");}
function smartPick(){let remaining=nums.filter(n=>!called.has(n));let win=bestLineMove(computerNums,computerMarked,remaining);if(win) return win;let block=bestLineMove(playerNums,playerMarked,remaining);if(block) return block;return bestStrategicMove(computerNums,computerMarked,remaining);}
function bestLineMove(board,marked,options){for(let r=0;r<SIZE;r++){let row=board.slice(r*SIZE,r*SIZE+SIZE);let count=row.filter(n=>marked.has(n)).length;if(count===SIZE-1){let missing=row.find(n=>!marked.has(n));if(options.includes(missing)) return missing;}}for(let c=0;c<SIZE;c++){let col=[];for(let r=0;r<SIZE;r++) col.push(board[r*SIZE+c]);let count=col.filter(n=>marked.has(n)).length;if(count===SIZE-1){let missing=col.find(n=>!marked.has(n));if(options.includes(missing)) return missing;}}return null;}
function bestStrategicMove(board,marked,options){let best=options[0],bestScore=-1;for(let n of options){let score=0;for(let r=0;r<SIZE;r++){let row=board.slice(r*SIZE,r*SIZE+SIZE);if(row.includes(n)) score+=row.filter(x=>marked.has(x)).length;}for(let c=0;c<SIZE;c++){let col=[];for(let r=0;r<SIZE;r++) col.push(board[r*SIZE+c]);if(col.includes(n)) score+=col.filter(x=>marked.has(x)).length;}if(score>bestScore){best=n;bestScore=score;}}return best;}
function processMark(n){mark("playerBoard",playerNums,playerMarked,n,false);mark("computerBoard",computerNums,computerMarked,n,true);let pLines=countLines(playerNums,playerMarked,"playerBoard");let cLines=countLines(computerNums,computerMarked,"computerBoard");updateLetters("playerLetters",pLines);updateLetters("computerLetters",cLines);if(pLines>=5) endGame("🎉 YOU WIN!"); else if(cLines>=5) endGame("🤖 COMPUTER WINS!");}
function mark(boardId,nums,marked,n,hide){if(nums.includes(n)){marked.add(n);let cell=document.getElementById(boardId+"-"+n);cell.classList.add("marked");if(hide) cell.classList.add("revealed");}}
function animateCall(n){document.querySelectorAll(".called").forEach(c=>c.classList.remove("called"));let cell=document.querySelector("[id$='-"+n+"']");if(cell) cell.classList.add("called");}
function countLines(board,marked,boardId){let lines=0;for(let r=0;r<SIZE;r++){let cells=board.slice(r*SIZE,r*SIZE+SIZE);if(cells.every(n=>marked.has(n))){lines++;pulse(boardId,cells);}}for(let c=0;c<SIZE;c++){let cells=[];for(let r=0;r<SIZE;r++) cells.push(board[r*SIZE+c]);if(cells.every(n=>marked.has(n))){lines++;pulse(boardId,cells);}}return lines;}
function pulse(boardId,cells){cells.forEach(n=>{let cell=document.getElementById(boardId+"-"+n);if(cell) cell.classList.add("lineWin");});}
function updateLetters(id,lines){let box=document.getElementById(id).children;for(let i=0;i<lines&&i<5;i++) box[i].classList.add("done");}
function status(t){document.getElementById("status").textContent=t;}
function endGame(text){document.getElementById("popup").textContent=text;document.getElementById("popup").classList.add("show");document.querySelectorAll(".cell").forEach(c=>c.onclick=null);}
</script>

</body>
