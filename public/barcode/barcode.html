<body>
  <canvas id="particles" class="particles"></canvas>

  <script>
    // Particle animation
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    
    let particles = [], num = 150;
    
    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.speedX = Math.random() - 0.5;
        this.speedY = Math.random() - 0.5;
      }
      
      update() {
        this.x += this.speedX; 
        this.y += this.speedY;
        
        if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
        if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
      }
      
      draw() {
        ctx.fillStyle = 'rgba(0,242,254,0.5)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, 2 * Math.PI);
        ctx.fill();
      }
    }
    
    function initParticles() {
      particles = [];
      for (let i = 0; i < num; i++) particles.push(new Particle());
    }
    
    function connectParticles() {
      for (let a = 0; a < particles.length; a++) {
        for (let b = a; b < particles.length; b++) {
          let dx = particles[a].x - particles[b].x;
          let dy = particles[a].y - particles[b].y;
          let distance = Math.hypot(dx, dy);
          
          if (distance < 100) {
            ctx.strokeStyle = `rgba(0,242,254,${0.1 - distance / 1000})`;
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(particles[a].x, particles[a].y);
            ctx.lineTo(particles[b].x, particles[b].y);
            ctx.stroke();
          }
        }
      }
    }
    
    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { 
        p.update(); 
        p.draw(); 
      });
      connectParticles();
      requestAnimationFrame(animateParticles);
    }
    
    initParticles(); 
    animateParticles();

    // Barcode Generator Logic
    const barcodeInput = document.getElementById('barcodeInput');
    const barcodeType = document.getElementById('barcodeType');
    const barcodeWidth = document.getElementById('barcodeWidth');
    const barcodeHeight = document.getElementById('barcodeHeight');
    const showText = document.getElementById('showText');
    const showBackground = document.getElementById('showBackground');
    const genBtn = document.getElementById('genBtn');
    const dlBtn = document.getElementById('dlBtn');
    const dlPng = document.getElementById('downloadPng');
    const dlSvg = document.getElementById('downloadSvg');
    const errDiv = document.getElementById('error');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const barcodeCanvas = document.getElementById('barcode');
    const barcodeTypeStat = document.getElementById('barcodeTypeStat');
    const dataLengthStat = document.getElementById('dataLengthStat');
    const barcodeSize = document.getElementById('barcodeSize');
    
    let selectedColor = '#000000';
    
    // Color swatches selection
    document.querySelectorAll('.swatch').forEach(swatch => {
      swatch.addEventListener('click', () => {
        selectedColor = swatch.getAttribute('data-color');
        document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
        swatch.classList.add('selected');
        if (dlBtn.style.display !== 'none') {
          generateBarcode();
        }
      });
    });

    function validateInput(type, value) {
      const typeValidations = {
        EAN13: value => /^\d{12,13}$/.test(value),
        EAN8: value => /^\d{7,8}$/.test(value),
        UPC: value => /^\d{11,12}$/.test(value),
        ITF: value => /^\d+$/.test(value) && value.length % 2 === 0,
        MSI: value => /^\d+$/.test(value),
        pharmacode: value => {
          const num = parseInt(value, 10);
          return /^\d+$/.test(value) && num >= 3 && num <= 131070;
        }
      };
      
      if (typeValidations[type] && !typeValidations[type](value)) {
        const errorMessages = {
          EAN13: "EAN-13 requires 12 or 13 digits",
          EAN8: "EAN-8 requires 7 or 8 digits",
          UPC: "UPC-A requires 11 or 12 digits",
          ITF: "ITF requires digits and even number of digits",
          MSI: "MSI requires only digits",
          pharmacode: "Pharmacode requires a number between 3-131070"
        };
        
        return errorMessages[type] || "Invalid format for selected barcode type";
      }
      
      return null;
    }
    
    function generateBarcode() {
      loadingSpinner.style.display = 'block';
      dlBtn.style.display = 'none';
      
      setTimeout(() => {
        try {
          const value = barcodeInput.value.trim();
          const type = barcodeType.value;
          const width = parseFloat(barcodeWidth.value);
          const height = parseInt(barcodeHeight.value);
          const displayValue = showText.checked;
          const transparent = showBackground.checked;
          
          // Validate input
          if (!value) {
            errDiv.textContent = 'Please enter data for the barcode';
            loadingSpinner.style.display = 'none';
            return;
          }
          
          const validationError = validateInput(type, value);
          if (validationError) {
            errDiv.textContent = validationError;
            loadingSpinner.style.display = 'none';
            return;
          }
          
          errDiv.textContent = '';
          
          // Update stats
          barcodeTypeStat.textContent = type;
          dataLengthStat.textContent = value.length;
          barcodeSize.textContent = `${height}px`;
          
          // Generate barcode
          const options = {
            format: type,
            width: width,
            height: height,
            displayValue: displayValue,
            font: "monospace",
            fontOptions: "bold",
            textMargin: 5,
            background: transparent ? "transparent" : "#ffffff",
            lineColor: selectedColor
          };
          
          // Clear previous barcode
          const ctx = barcodeCanvas.getContext('2d');
          ctx.clearRect(0, 0, barcodeCanvas.width, barcodeCanvas.height);
          
          // Generate new barcode
          JsBarcode(barcodeCanvas, value, options);
          
          // Show download buttons
          dlBtn.style.display = 'flex';
          loadingSpinner.style.display = 'none';
          
        } catch (error) {
          errDiv.textContent = 'Error generating barcode. Please try again.';
          console.error('Barcode generation error:', error);
          loadingSpinner.style.display = 'none';
        }
      }, 300);
    }
    
    // Download handlers
    dlPng.addEventListener('click', function(e) {
      e.preventDefault();
      try {
        const dataUrl = barcodeCanvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = 'opas-barcode.png';
        link.href = dataUrl;
        link.click();
      } catch (error) {
        errDiv.textContent = 'Error downloading PNG. Please try again.';
        console.error('PNG download error:', error);
      }
    });
    
    dlSvg.addEventListener('click', function(e) {
      e.preventDefault();
      try {
        // Create SVG element for download
        const svgElement = document.createElement('svg');
        svgElement.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        
        // Generate SVG barcode
        JsBarcode(svgElement, barcodeInput.value.trim(), {
          format: barcodeType.value,
          width: parseFloat(barcodeWidth.value),
          height: parseInt(barcodeHeight.value),
          displayValue: showText.checked,
          background: showBackground.checked ? "transparent" : "#ffffff",
          lineColor: selectedColor
        });
        
        // Serialize SVG to string
        const svgData = new XMLSerializer().serializeToString(svgElement);
        
        // Create Blob and download
        const blob = new Blob([svgData], {type: "image/svg+xml"});
        const url = URL.createObjectURL(blob);
        
        const link = document.createElement('a');
        link.download = 'opas-barcode.svg';
        link.href = url;
        link.click();
        
        // Clean up
        setTimeout(() => URL.revokeObjectURL(url), 100);
      } catch (error) {
        errDiv.textContent = 'Error downloading SVG. Please try again.';
        console.error('SVG download error:', error);
      }
    });
    
    // Generate barcode on page load
    window.addEventListener('load', function() {
      generateBarcode();
    });
    
    // Generate when clicking button
    genBtn.addEventListener('click', generateBarcode);
    
    // Generate when changing settings
    [barcodeType, barcodeWidth, barcodeHeight, showText, showBackground].forEach(element => {
      element.addEventListener('change', function() {
        if (barcodeInput.value.trim()) {
          generateBarcode();
        }
      });
    });
    
    // Generate when pressing Enter in input
    barcodeInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        generateBarcode();
      }
    });
  </script>
</body>
</html>
