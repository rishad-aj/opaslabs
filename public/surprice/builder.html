<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine Link Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nunito:wght@300;400;700&family=Sacramento&display=swap" rel="stylesheet">
  
  <style>
    /* =========================================
       GLOBAL VARIABLES & RESET
       ========================================= */
    :root {
      --primary-pink: #ff69b4;
      --dark-pink: #d63384;
      --soft-pink: #ffe6eb;
      --white-bg: #fff0f3;
      --text-color: #880e4f;
      --glass-white: rgba(255, 255, 255, 0.7);
      --glass-border: rgba(255, 255, 255, 0.8);
      --shadow-light: 0 8px 32px 0 rgba(255, 105, 180, 0.2);
      --btn-gradient: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow-x: hidden;
      background-color: var(--white-bg);
      font-family: 'Nunito', sans-serif;
      color: var(--text-color);
      user-select: none;
      -webkit-user-select: none;
    }

    /* =========================================
       BACKGROUND CANVAS (MATRIX HEARTS)
       ========================================= */
    #heartMatrix {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.5;
    }

    /* =========================================
       MAIN CONTAINER
       ========================================= */
    .main-wrapper {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* =========================================
       HEADER
       ========================================= */
    .top-bar {
      width: 100%;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      top: 0;
    }

    .music-player {
      background: var(--glass-white);
      padding: 10px 25px;
      border-radius: 50px;
      backdrop-filter: blur(8px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-light);
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 0.9rem;
      animation: float 4s ease-in-out infinite;
    }

    .play-icon {
      width: 35px;
      height: 35px;
      background: var(--primary-pink);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 14px;
      animation: spin 4s linear infinite;
      box-shadow: 0 0 10px rgba(255, 105, 180, 0.5);
    }

    .track-info {
      display: flex;
      flex-direction: column;
    }

    .track-name {
      font-weight: 700;
      color: var(--dark-pink);
    }

    .track-artist {
      font-size: 0.75rem;
      color: #aaa;
    }

    /* =========================================
       MAIN CARD STYLING
       ========================================= */
    .valentine-card {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 30px;
      padding: 50px 40px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(214, 51, 132, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.9);
      max-width: 500px;
      width: 100%;
      position: relative;
      margin-top: 30px;
    }

    .main-title {
      font-family: 'Great Vibes', cursive;
      font-size: 3.5rem;
      background: -webkit-linear-gradient(#ff69b4, #ff1493);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 30px;
      line-height: 1.2;
      filter: drop-shadow(2px 2px 0px rgba(255, 255, 255, 0.8));
    }

    /* =========================================
       FORM ELEMENTS
       ========================================= */
    .input-group {
      margin-bottom: 25px;
      text-align: left;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--dark-pink);
      font-size: 1.1rem;
    }

    input, textarea {
      width: 100%;
      padding: 16px 20px;
      border: 2px solid #ffe5ec;
      border-radius: 15px;
      font-size: 1rem;
      font-family: 'Nunito', sans-serif;
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-color);
      transition: all 0.3s ease;
      resize: none;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary-pink);
      box-shadow: 0 0 0 3px rgba(255, 105, 180, 0.2);
      background: white;
    }

    input::placeholder, textarea::placeholder {
      color: #d4a9c0;
    }

    /* =========================================
       BUTTON STYLING
       ========================================= */
    .btn {
      padding: 16px 40px;
      border-radius: 50px;
      border: none;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Nunito', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      min-height: 60px;
      width: 100%;
      margin-top: 10px;
    }

    .btn-main {
      background: linear-gradient(45deg, #ff69b4, #ff8da1);
      color: white;
      box-shadow: 0 10px 25px rgba(255, 105, 180, 0.4);
    }

    .btn-main:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(255, 105, 180, 0.6);
    }

    .btn-main:active {
      transform: scale(0.95);
    }

    .btn-secondary {
      background: white;
      color: var(--text-color);
      border: 2px solid #ffdae9;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
      margin-top: 15px;
    }

    .btn-secondary:hover {
      background: var(--soft-pink);
      transform: translateY(-2px);
    }

    /* =========================================
       RESULT DISPLAY
       ========================================= */
    #result {
      margin-top: 30px;
      padding-top: 25px;
      border-top: 2px dashed #ffccd5;
      display: none;
      animation: fadeIn 0.5s ease;
    }

    .link-display {
      background: rgba(255, 240, 245, 0.9);
      padding: 20px;
      border-radius: 15px;
      font-size: 0.9rem;
      word-break: break-all;
      border: 1px solid #ffccd5;
      color: var(--dark-pink);
      margin-bottom: 20px;
      text-align: left;
      line-height: 1.5;
      font-family: monospace;
    }

    .success-message {
      background: linear-gradient(45deg, #ff69b4, #ff1493);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 15px;
    }

    /* =========================================
       ANIMATIONS
       ========================================= */
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* =========================================
       FOOTER
       ========================================= */
    .footer-note {
      margin-top: 30px;
      text-align: center;
      color: var(--dark-pink);
      font-size: 0.9rem;
      opacity: 0.8;
      max-width: 500px;
    }

    /* =========================================
       MOBILE RESPONSIVE DESIGN
       ========================================= */
    @media (max-width: 768px) {
      .main-title {
        font-size: 2.8rem;
      }
      
      .valentine-card {
        padding: 30px 20px;
        margin-top: 60px;
      }
      
      input, textarea {
        padding: 14px 16px;
      }
      
      .btn {
        padding: 14px 30px;
        font-size: 1.1rem;
        min-height: 50px;
      }
      
      .music-player {
        padding: 8px 20px;
        font-size: 0.8rem;
      }
      
      .play-icon {
        width: 30px;
        height: 30px;
        font-size: 12px;
      }
    }

    @media (max-width: 480px) {
      .main-title {
        font-size: 2.2rem;
      }
      
      .valentine-card {
        padding: 25px 15px;
      }
      
      .btn {
        padding: 12px 25px;
        font-size: 1rem;
      }
      
      .link-display {
        font-size: 0.8rem;
        padding: 15px;
      }
    }
  </style>
</head>
<body>
  <canvas id="heartMatrix"></canvas>

  <div class="main-wrapper">
    <div class="top-bar">
      <div class="music-player">
        <div class="play-icon">💝</div>
        <div class="track-info">
          <span class="track-name">Valentine Link Creator</span>
          <span class="track-artist">Make your special link</span>
        </div>
      </div>
    </div>

    <div class="valentine-card">
      <h1 class="main-title">Create Your Magic Link</h1>
      
      <div class="input-group">
        <label for="nameInp">💖 Your Valentine's Name</label>
        <input type="text" id="nameInp" placeholder="Enter their name...">
      </div>
      
      <div class="input-group">
        <label for="msgInp">💌 Your Personal Message</label>
        <textarea id="msgInp" placeholder="Write a sweet message..." rows="3"></textarea>
      </div>
      
      <button class="btn btn-main" onclick="generateLink()">Create Magic Link ✨</button>
      
      <div id="result">
        <p class="success-message">Your personalized Valentine link is ready!</p>
        <div class="link-display" id="finalLink"></div>
        <button class="btn btn-secondary" id="copyBtn" onclick="copyToClipboard()">Copy Link to Clipboard</button>
      </div>
    </div>
    
    <div class="footer-note">
      <p>💝 Send this link to your special someone for a Valentine's Day surprise!</p>
    </div>
  </div>

  <script>
    /**
     * =========================================
     * MATRIX HEART RAIN BACKGROUND
     * =========================================
     */
    const canvas = document.getElementById('heartMatrix');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    const hearts = "❤♥♡";
    const chars = hearts.split("");

    const fontSize = 20;
    const columns = width / fontSize;
    const drops = [];

    for (let i = 0; i < columns; i++) {
      drops[i] = Math.random() * -100;
    }

    function drawMatrix() {
      ctx.fillStyle = "rgba(255, 240, 243, 0.2)";
      ctx.fillRect(0, 0, width, height);

      ctx.font = fontSize + "px Arial";

      for (let i = 0; i < drops.length; i++) {
        const colors = ["#ff69b4", "#ff1493", "#ffb7c5", "#e91e63"];
        ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];

        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > height && Math.random() > 0.98) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    setInterval(drawMatrix, 50);

    /**
     * =========================================
     * LINK GENERATOR FUNCTIONALITY
     * =========================================
     */
    function generateLink() {
      const name = document.getElementById('nameInp').value.trim();
      const msg = document.getElementById('msgInp').value.trim();

      // Default values if empty
      const finalName = name || "My Love";
      const finalMsg = msg || "You mean everything to me 🌹";

      // Get the current page URL and replace with the Valentine page
      let baseUrl = window.location.href;
      
      // Remove any query parameters and get just the base
      baseUrl = baseUrl.split('?')[0];
      
      // Replace the current filename with the Valentine page filename
      // If you're using different filenames, adjust this line
      baseUrl = baseUrl.replace('builder.html', 'valentine-gift.html');
      
      // If the page isn't named builder.html, you might need to adjust:
      // baseUrl = baseUrl.substring(0, baseUrl.lastIndexOf('/') + 1) + 'valentine-gift.html';

      // Create the URL with query parameters
      const params = new URLSearchParams();
      params.append('name', finalName);
      params.append('msg', finalMsg);
      
      const finalUrl = `${baseUrl}?${params.toString()}`;

      // Display the result
      document.getElementById('finalLink').textContent = finalUrl;
      document.getElementById('result').style.display = 'block';
      
      // Reset copy button text
      const copyBtn = document.getElementById('copyBtn');
      copyBtn.textContent = 'Copy Link to Clipboard';
      copyBtn.style.background = 'white';
      
      // Smooth scroll to result
      document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
    }

    function copyToClipboard() {
      const link = document.getElementById('finalLink').textContent;
      
      // Use the Clipboard API
      navigator.clipboard.writeText(link).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = "✅ Copied Successfully!";
        btn.style.background = "linear-gradient(45deg, #4CAF50, #45a049)";
        
        // Reset button after 2 seconds
        setTimeout(() => {
          btn.textContent = "Copy Link to Clipboard";
          btn.style.background = "white";
        }, 2000);
      }).catch(err => {
        console.error('Failed to copy: ', err);
        alert('Failed to copy link. Please try again or copy manually.');
      });
    }

    // Allow pressing Enter to generate link
    document.getElementById('nameInp').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        generateLink();
      }
    });

    document.getElementById('msgInp').addEventListener('keypress', function(e) {
      if (e.ctrlKey && e.key === 'Enter') {
        generateLink();
      }
    });
  </script>
</body>
</html>
