<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine Link Generator</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #fff5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background: white;
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 400px;
    }
    h2 {
      color: #ff4d6d;
      text-align: center;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 2px solid #ffccd5;
      border-radius: 10px;
      box-sizing: border-box;
      outline: none;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #ff4d6d;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      transition: 0.3s;
    }
    button:hover {
      background: #ff758f;
    }
    #result {
      margin-top: 20px;
      display: none;
    }
    .link-display {
      background: #f8f9fa;
      padding: 10px;
      border-radius: 5px;
      font-size: 0.8rem;
      word-break: break-all;
      border: 1px solid #ddd;
    }
    .copy-btn {
      background: #4dabf7;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>💝 Link Generator</h2>
    <input type="text" id="nameInp" placeholder="Enter partner's name...">
    <textarea id="msgInp" placeholder="Enter a special message..." rows="3"></textarea>
    <button onclick="generateLink()">Generate Magic Link</button>

    <div id="result">
      <p style="font-size: 0.9rem; color: #666;">
        Copy and send this link:
      </p>
      <div class="link-display" id="finalLink"></div>
      <button class="copy-btn" id="copyBtn" onclick="copyToClipboard()">Copy Link</button>
    </div>
  </div>

  <script>
    function generateLink() {
      const name = document.getElementById('nameInp').value;
      const msg = document.getElementById('msgInp').value;

      // This gets the base URL of your site
      // If you're on GitHub Pages, it will look like: https://user.github.io/repo/
      const baseUrl = window.location.href.replace('builder.html', 'valentine-gift.html');

      // Build the query string
      const params = new URLSearchParams();
      if (name) params.append('name', name);
      if (msg) params.append('msg', msg);

      const finalUrl = `${baseUrl}?${params.toString()}`;

      document.getElementById('finalLink').textContent = finalUrl;
      document.getElementById('result').style.display = 'block';
    }

    function copyToClipboard() {
      const link = document.getElementById('finalLink').textContent;
      navigator.clipboard.writeText(link);
      const btn = document.getElementById('copyBtn');
      btn.textContent = "✅ Copied!";
      btn.style.background = "#40c057";
      setTimeout(() => {
        btn.textContent = "Copy Link";
        btn.style.background = "#4dabf7";
      }, 2000);
    }
  </script>

</body>
</html>
