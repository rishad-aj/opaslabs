<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple QR Code Generator</title>
  <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      padding: 2rem;
      text-align: center;
    }
    .box {
      background: white;
      padding: 2rem;
      max-width: 400px;
      margin: auto;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }
    input, select, button {
      width: 100%;
      padding: 0.6rem;
      margin-top: 0.5rem;
      font-size: 1rem;
    }
    #qrcode {
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>QR Code Generator</h2>
    <label>Text or URL:</label>
    <input type="text" id="qrText" placeholder="https://example.com" />

    <label>Color:</label>
    <input type="color" id="qrColor" value="#000000"/>

    <label>Size (px):</label>
    <select id="qrSize">
      <option value="150">150</option>
      <option value="200" selected>200</option>
      <option value="250">250</option>
      <option value="300">300</option>
    </select>

    <label>Pattern Style:</label>
    <select id="qrPattern">
      <option value="square">Square</option>
      <option value="dots">Dots</option>
      <option value="rounded">Rounded</option>
      <option value="extra-rounded">Extra Rounded</option>
      <option value="circle">Circle</option>
      <option value="classy">Classy</option>
      <option value="classy-rounded">Classy Rounded</option>
      <option value="square-rounded">Square Rounded</option>
      <option value="liquid">Liquid</option>
      <option value="sharp">Sharp</option>
      <option value="soft">Soft</option>
      <option value="diamond">Diamond</option>
      <option value="leaf">Leaf</option>
      <option value="line">Line</option>
      <option value="plus">Plus</option>
    </select>

    <button onclick="generateQR()">Generate QR</button>

    <div id="qrcode"></div>
  </div>

  <script>
    let qrCode;

    function generateQR() {
      const text = document.getElementById("qrText").value.trim();
      const color = document.getElementById("qrColor").value;
      const size = parseInt(document.getElementById("qrSize").value);
      const pattern = document.getElementById("qrPattern").value;

      if (!text) {
        alert("Please enter a valid URL or text.");
        return;
      }

      if (qrCode) qrCode._canvas.innerHTML = "";

      qrCode = new QRCodeStyling({
        width: size,
        height: size,
        data: text,
        dotsOptions: {
          color: color,
          type: pattern
        },
        backgroundOptions: {
          color: "#ffffff"
        }
      });

      document.getElementById("qrcode").innerHTML = "";
      qrCode.append(document.getElementById("qrcode"));
    }
  </script>
</body>
</html>
