<!DOCTYPE html>
<html lang="en">
<head>
  <title>Secure QR Code Generator by Opas Labs | Free, Fast & Customizable</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="title" content="Secure QR Code Generator by Opas Labs | Free, Fast & Customizable">
  <meta name="description" content="Generate safe, fast, and customizable QR codes with Opas Labs. Free tool for URLs, websites, contact info, and more. Supports all secure and legal links.">
  <meta name="keywords" content="QR Code Generator, Free QR Code, Custom QR Code Maker, Safe QR Code Generator, Online QR Creator, Professional QR Tool, Secure URL QR Code, Website QR Generator, QR for Business, Opas Labs QR, No-login QR code, Stylish QR code, Dynamic QR code, Legal link QR, HTTPS QR Code, Non-porn QR, Safe Link QR, QR code downloader, High-quality QR codes">
  <meta name="author" content="Opas Labs">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://yourdomain.com/">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <style>
    /* ...[keep all your current styles as-is]... */
    /* Add this modal style if it's not already included */
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(7, 10, 21, 0.4);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .modal-content {
      background: rgba(12, 16, 33, 0.9);
      padding: 2rem;
      border-radius: 15px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      color: #f5f9ff;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .modal-content h2 {
      color: var(--accent);
      margin-bottom: 1rem;
    }
    .modal-content p {
      margin-bottom: 1rem;
    }
    .modal-content a {
      color: var(--accent);
      text-decoration: underline;
    }
    .modal-content .modal-btns {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .modal-btns button {
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }
    .modal-btns .accept {
      background: linear-gradient(90deg, #4CAF50, #2E7D32);
      color: white;
    }
    .modal-btns .decline {
      background: linear-gradient(90deg, #f44336, #d32f2f);
      color: white;
    }
  </style>
</head>
<body>
  <canvas id="particles" class="particles"></canvas>
  <div class="container">
    <div class="logo">
      <h1>Opas Labs</h1>
      <p>Secure QR Code Generator for All Safe Links</p>
    </div>

    <div class="input-group">
      <label for="urlInput">Enter URL</label>
      <i class="fas fa-link"></i>
      <input type="text" id="urlInput" placeholder="https://example.com">
    </div>

    <div class="input-group">
      <label for="qrSize">QR Code Size</label>
      <i class="fas fa-expand"></i>
      <select id="qrSize">
        <option value="150">Small (150px)</option>
        <option value="200" selected>Medium (200px)</option>
        <option value="250">Large (250px)</option>
      </select>
    </div>

    <label style="margin-left:3rem; margin-bottom:0.5rem; font-weight:600; color: var(--accent);">Pick QR Color</label>
    <div class="swatches" id="colorSwatches"></div>

    <button id="genBtn"><i class="fas fa-qrcode"></i> Generate QR Code</button>

    <div id="error"></div>
    <div id="qrcode"></div>

    <div class="download-btn" id="dlBtn" style="display:none;">
      <a href="#" download="opas-qr.png"><i class="fas fa-download"></i> Download QR</a>
    </div>
  </div>

  <!-- ✅ Modal for T&C -->
  <div id="tcModal" class="modal" style="display: none;">
    <div class="modal-content">
      <h2><i class="fas fa-scroll"></i> Terms & Privacy</h2>
      <p>Please review our 
        <a href="qr-terms-and-condition.html" target="_blank">Terms and Conditions</a> and 
        <a href="qr-privacy-policy.html" target="_blank">Privacy Policy</a> before using the tool.</p>
      <div class="modal-btns">
        <button class="accept" id="acceptTCBtn"><i class="fas fa-check-circle"></i> Accept</button>
        <button class="decline" onclick="location.href='https://www.google.com'"><i class="fas fa-times-circle"></i> Decline</button>
      </div>
    </div>
  </div>

  <script>
    // Particle animation (keep your original version)
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let parts = [], num = 150;
    class P {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.sx = Math.random() - 0.5;
        this.sy = Math.random() - 0.5;
      }
      update() {
        this.x += this.sx; this.y += this.sy;
        if (this.x < 0 || this.x > canvas.width) this.sx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.sy *= -1;
      }
      draw() {
        ctx.fillStyle = 'rgba(0,242,254,0.5)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, 2 * Math.PI);
        ctx.fill();
      }
    }

    function init() {
      parts = [];
      for (let i = 0; i < num; i++) parts.push(new P());
    }

    function connect() {
      for (let a = 0; a < parts.length; a++) {
        for (let b = a; b < parts.length; b++) {
          let dx = parts[a].x - parts[b].x;
          let dy = parts[a].y - parts[b].y;
          let d = Math.hypot(dx, dy);
          if (d < 100) {
            ctx.strokeStyle = `rgba(0,242,254,${0.1 - d / 1000})`;
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(parts[a].x, parts[a].y);
            ctx.lineTo(parts[b].x, parts[b].y);
            ctx.stroke();
          }
        }
      }
    }

    function anim() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      parts.forEach(p => { p.update(); p.draw(); });
      connect();
      requestAnimationFrame(anim);
    }
    init(); anim();

    const colors = ['#000000', '#0066cc', '#cc0000', '#00aa00', '#6600cc', '#ffaa00'];
    let selectedColor = colors[0];
    const swDiv = document.getElementById('colorSwatches');
    colors.forEach(c => {
      const d = document.createElement('div');
      d.className = 'swatch'; d.style.background = c;
      if (c === selectedColor) d.classList.add('selected');
      d.onclick = () => {
        selectedColor = c;
        document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
        d.classList.add('selected');
      };
      swDiv.appendChild(d);
    });

    const genBtn = document.getElementById('genBtn');
    const dlBtn = document.getElementById('dlBtn');
    const dlLink = dlBtn.querySelector('a');
    const qrDiv = document.getElementById('qrcode');
    const errDiv = document.getElementById('error');

    genBtn.onclick = () => {
      const url = document.getElementById('urlInput').value.trim();
      const size = parseInt(document.getElementById('qrSize').value);
      qrDiv.innerHTML = ''; errDiv.textContent = '';
      if (!/^https?:\/\//i.test(url)) {
        errDiv.textContent = 'Enter valid URL (http:// or https://)';
        return;
      }
      QRCode.toDataURL(url, {
        width: size,
        margin: 2,
        color: {
          dark: selectedColor,
          light: "#ffffff"
        }
      }, (err, dataUrl) => {
        if (err) {
          errDiv.textContent = 'Failed to generate.';
          return;
        }
        const img = new Image(); img.src = dataUrl; img.alt = 'QR Code';
        qrDiv.appendChild(img);
        dlBtn.style.display = 'block';
        dlLink.href = dataUrl;
      });
    };

    // Terms Modal Logic
    const tcModal = document.getElementById('tcModal');
    const acceptBtn = document.getElementById('acceptTCBtn');

    document.addEventListener('DOMContentLoaded', () => {
      if (!localStorage.getItem('qrAccepted')) {
        tcModal.style.display = 'flex';
      }
    });

    acceptBtn.onclick = () => {
      localStorage.setItem('qrAccepted', 'true');
      tcModal.style.display = 'none';
    };
  </script>
</body>
</html>
