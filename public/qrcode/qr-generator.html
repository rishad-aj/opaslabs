      <style>

   <body>
      <canvas id="particles" class="particles"></canvas>
      <div class="container">
         <div class="logo">
            <h1>Opas Labs</h1>
            <p>Secure QR Code Generator for All Safe Links</p>
         </div>
         <div class="input-group">
            <label for="urlInput">Enter URL</label>
            <i class="fas fa-link"></i>
            <input type="text" id="urlInput" placeholder="https://example.com">
         </div>
         <div class="input-group">
            <label for="qrSize">QR Code Size</label>
            <i class="fas fa-expand"></i>
            <select id="qrSize">
               <option value="150">Small (150px)</option>
               <option value="200" selected>Medium (200px)</option>
               <option value="250">Large (250px)</option>
            </select>
         </div>
         <label style="margin-left:3rem; margin-bottom:0.5rem; font-weight:600; color: var(--accent);">Pick QR Color</label>
         <div class="swatches" id="colorSwatches"></div>
         <button id="genBtn"><i class="fas fa-qrcode"></i> Generate QR Code</button>
         <div id="error"></div>
         <div id="qrcode"></div>
         <div class="download-btn" id="dlBtn" style="display:none;">
            <a href="#" download="opas-qr.png"><i class="fas fa-download"></i> Download QR</a>
         </div>
      </div>
      <!-- Terms Modal -->
      <div id="termsModal" class="terms-modal">
         <div class="terms-modal-content">
            <h2><i class="fas fa-scroll"></i> Terms & Conditions</h2>
            <p>
               Please review our 
               <a href="qrcode/qr-terms-and-condition.html" target="_blank" style="color: var(--accent); text-decoration: underline;">Terms and Conditions</a> 
               and 
               <a href="qrcode/qr-privacy-policy.html" target="_blank" style="color: var(--accent); text-decoration: underline;">Privacy Policy</a> 
               before using this tool.
            </p>
            <p>By clicking "Accept" below, you agree to our terms and acknowledge that this tool is for legitimate purposes only.</p>
            <div class="terms-btn-group">
               <button class="terms-btn decline" id="declineTermsBtn">
               <i class="fas fa-times-circle"></i> Decline
               </button>
               <button class="terms-btn accept" id="acceptTermsBtn">
               <i class="fas fa-check-circle"></i> Accept
               </button>
            </div>

      <script>
         // Particle animation
         const canvas = document.getElementById('particles');
         const ctx = canvas.getContext('2d');
         function resizeCanvas() {
           canvas.width = window.innerWidth;
           canvas.height = window.innerHeight;
         }
         window.addEventListener('resize', resizeCanvas);
         resizeCanvas();
         
         let parts = [], num = 150;
         class P {
           constructor() {
             this.x = Math.random() * canvas.width;
             this.y = Math.random() * canvas.height;
             this.size = Math.random() * 2 + 0.5;
             this.sx = Math.random() - 0.5;
             this.sy = Math.random() - 0.5;
           }
           update() {
             this.x += this.sx; this.y += this.sy;
             if (this.x < 0 || this.x > canvas.width) this.sx *= -1;
             if (this.y < 0 || this.y > canvas.height) this.sy *= -1;
           }
           draw() {
             ctx.fillStyle = 'rgba(0,242,254,0.5)';
             ctx.beginPath();
             ctx.arc(this.x, this.y, this.size, 0, 2 * Math.PI);
             ctx.fill();
           }
         }
         
         function init() {
           parts = [];
           for (let i = 0; i < num; i++) parts.push(new P());
         }
         
         function connect() {
           for (let a = 0; a < parts.length; a++) {
             for (let b = a; b < parts.length; b++) {
               let dx = parts[a].x - parts[b].x;
               let dy = parts[a].y - parts[b].y;
               let d = Math.hypot(dx, dy);
               if (d < 100) {
                 ctx.strokeStyle = `rgba(0,242,254,${0.1 - d / 1000})`;
                 ctx.lineWidth = 0.5;
                 ctx.beginPath();
                 ctx.moveTo(parts[a].x, parts[a].y);
                 ctx.lineTo(parts[b].x, parts[b].y);
                 ctx.stroke();
               }
             }
           }
         }
         
         function anim() {
           ctx.clearRect(0, 0, canvas.width, canvas.height);
           parts.forEach(p => { p.update(); p.draw(); });
           connect();
           requestAnimationFrame(anim);
         }
         init(); anim();
         
         // QR Code Generator
         const colors = ['#000000', '#0066cc', '#cc0000', '#00aa00', '#6600cc', '#ffaa00'];
         let selectedColor = colors[0];
         const swDiv = document.getElementById('colorSwatches');
         colors.forEach(c => {
           const d = document.createElement('div');
           d.className = 'swatch'; d.style.background = c;
           if (c === selectedColor) d.classList.add('selected');
           d.onclick = () => {
             selectedColor = c;
             document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
             d.classList.add('selected');
           };
           swDiv.appendChild(d);
         });
         
         const genBtn = document.getElementById('genBtn');
         const dlBtn = document.getElementById('dlBtn');
         const dlLink = dlBtn.querySelector('a');
         const qrDiv = document.getElementById('qrcode');
         const errDiv = document.getElementById('error');
         const termsModal = document.getElementById('termsModal');
         const acceptTermsBtn = document.getElementById('acceptTermsBtn');
         const declineTermsBtn = document.getElementById('declineTermsBtn');
         
         function generateQRCode() {
           const url = document.getElementById('urlInput').value.trim();
           const size = parseInt(document.getElementById('qrSize').value);
           qrDiv.innerHTML = ''; errDiv.textContent = '';
           
           if (!/^https?:\/\//i.test(url)) {
             errDiv.textContent = 'Enter valid URL (http:// or https://)';
             return false;
           }
           
           QRCode.toDataURL(url, {
             width: size,
             margin: 2,
             color: {
               dark: selectedColor,
               light: "#ffffff"
             }
           }, (err, dataUrl) => {
             if (err) {
               errDiv.textContent = 'Failed to generate.';
               return false;
             }
             const img = new Image(); img.src = dataUrl; img.alt = 'QR Code';
             qrDiv.appendChild(img);
             dlBtn.style.display = 'block';
             dlLink.href = dataUrl;
           });
           
           return true;
         }
         
         // Show terms modal when generate button is clicked
         genBtn.onclick = () => {
           const url = document.getElementById('urlInput').value.trim();
           if (!url) {
             errDiv.textContent = 'Please enter a URL first';
             return;
           }
           
           // Check if terms were already accepted
           if (localStorage.getItem('qrTermsAccepted') === 'true') {
             generateQRCode();
           } else {
             termsModal.style.display = 'flex';
           }
         };
         
         // Terms modal buttons
         acceptTermsBtn.onclick = () => {
           localStorage.setItem('qrTermsAccepted', 'true');
           termsModal.style.display = 'none';
           generateQRCode();
         };
         
         declineTermsBtn.onclick = () => {
           termsModal.style.display = 'none';
           window.location.href = 'https://www.google.com';
         };
         
         // Close modal when clicking outside
         termsModal.addEventListener('click', (e) => {
           if (e.target === termsModal) {
             termsModal.style.display = 'none';
           }
         });
      </script>
