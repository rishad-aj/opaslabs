  <style>
    :root {
      --primary: #6a11cb;
      --secondary: #2575fc;
      --accent: #00f2fe;
      --dark: #0c1021;
      --darker: #070a15;
      --light: #f5f9ff;
      --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, var(--darker), var(--dark));
      color: var(--light);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.6;
    }
    .particles {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1; opacity: 0.3;
    }    
    .container {
      max-width: 600px;
      margin: 4rem auto;
      padding: 2rem;
      background: rgba(12,16,33,0.8);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      position: relative; overflow: hidden; z-index:10;
    }
    .container::before {
      content:'';
      position:absolute; top:-50%; left:-50%;
      width:200%; height:200%;
      background: radial-gradient(circle, rgba(0,242,254,0.1) 0%, transparent 70%);
      animation: rotate 15s linear infinite; z-index:-1;
    }
    .logo {
      text-align: center; margin-bottom: 2rem;
    }
    .logo h1 {
      font-size: 2.5rem;
      background: linear-gradient(90deg, var(--accent), var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      margin-bottom: 0.5rem;
    }
    .logo p {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.7);
    }
    .input-group {
      margin-bottom: 1.5rem;
      position: relative;
    }
    .input-group label {
      display: block; margin-bottom: 0.5rem;
      font-weight: 600; color: var(--accent);
    }
    .input-group i {
      position: absolute; left:15px; top:70%;
      transform: translateY(-50%);
      color: var(--accent); font-size:1.2rem;
    }
    input[type="text"], input[type="url"], select {
      width:100%;
      padding: 1rem 0.8rem 1rem 3rem;
      background: rgba(7,10,21,0.7);
      color: var(--light);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:8px;
      font-size:16px;
      transition: var(--transition);
    }
    input:focus, select:focus {
      outline:none;
      border-color:var(--accent);
      box-shadow: 0 0 0 3px rgba(0,242,254,0.2);
    }
    .swatches {
      display:flex; gap:1rem; flex-wrap: wrap;
      margin-bottom:1.5rem;
      padding-left:3rem;
    }
    .swatch {
      width:32px; height:32px; border-radius:50%;
      border:2px solid rgba(255,255,255,0.3);
      cursor:pointer; transition: var(--transition);
    }
    .swatch.selected {
      border-color: var(--accent);
      transform: scale(1.1);
    }
    button {
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      color: white; border:none;
      padding: 1rem 1.5rem;
      border-radius:8px;
      font-size:16px;
      cursor:pointer;
      width:100%;
      font-weight:bold;
      transition: var(--transition);
      box-shadow:0 5px 15px rgba(37,117,252,0.3);
      display:flex; align-items:center; justify-content:center; gap:10px;
    }
    button:hover {
      transform: translateY(-3px);
      box-shadow:0 8px 20px rgba(37,117,252,0.4);
    }
    #error {
      margin-top:1rem; color:#f44336; font-weight:600; text-align:center;
    }
    #qrcode {
      margin-top:1.5rem; text-align:center;
      padding-left:3rem;
    }
    #qrcode img {
      background:#fff; padding:1rem; border-radius:8px;
      border:1px solid rgba(0,0,0,0.1);
      max-width:250px;
    }
    .download-btn {
      margin-top:1.5rem; padding-left:3rem;
    }

      background: linear-gradient(90deg,#4caf50,#2e7d32);
      color:white; text-decoration:none;
      padding:1rem 1.5rem;
      border-radius:8px;

      box-shadow:0 5px 15px rgba(76,175,80,0.3);
      transition: var(--transition);
      width:100%;
    }
    .download-btn a:hover {
      transform: translateY(-3px);
      box-shadow:0 8px 20px rgba(76,175,80,0.4);
    }
    @keyframes rotate { 0%{transform:rotate(0deg);}100%{transform:rotate(360deg);} }
    @media(max-width:768px) {
      .container { margin:2rem 1rem; padding:1.5rem; }

{

  "browserRequirements": "Requires JavaScript",

<body>
  <canvas id="particles" class="particles"></canvas>
  <div class="container">
    <div class="logo">
      <h1>Opas Labs</h1>
      <p>Secure QR Code Generator for All Safe Links</p>
    </div>

    <div class="input-group">
      <label for="urlInput">Enter URL</label>
      <i class="fas fa-link"></i>
      <input type="text" id="urlInput" placeholder="https://example.com">
    </div>

    <div class="input-group">
      <label for="qrSize">QR Code Size</label>
      <i class="fas fa-expand"></i>
      <select id="qrSize">
        <option value="150">Small (150px)</option>
        <option value="200" selected>Medium (200px)</option>
        <option value="250">Large (250px)</option>
      </select>
    </div>

    <label style="margin-left:3rem; margin-bottom:0.5rem; font-weight:600; color: var(--accent);">Pick QR Color</label>
    <div class="swatches" id="colorSwatches"></div>

    <button id="genBtn"><i class="fas fa-qrcode"></i> Generate QR Code</button>

    <div id="error"></div>

    <div id="qrcode"></div>

    <div class="download-btn" id="dlBtn" style="display:none;">
      <a href="#" download="opas-qr.png"><i class="fas fa-download"></i> Download QR</a>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    let parts = [], num = 150;
    class P { constructor(){ this.x = Math.random()*canvas.width; this.y = Math.random()*canvas.height; this.size = Math.random()*2+0.5; this.sx = Math.random()-0.5; this.sy = Math.random()-0.5; }
      update(){ this.x += this.sx; this.y += this.sy; if(this.x<0 || this.x>canvas.width) this.sx *= -1; if(this.y<0 || this.y>canvas.height) this.sy *= -1; }
      draw(){ ctx.fillStyle = 'rgba(0,242,254,0.5)'; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,2*Math.PI); ctx.fill(); }
    }
    function init(){ parts=[]; for(let i=0;i<num;i++) parts.push(new P()); }
    function connect(){ for(let a=0;a<parts.length;a++) for(let b=a;b<parts.length;b++){
        let dx=parts[a].x-parts[b].x, dy=parts[a].y-parts[b].y, d=Math.hypot(dx,dy);
        if(d<100){ ctx.strokeStyle = `rgba(0,242,254,${0.1-d/1000})`; ctx.lineWidth=0.5;
        ctx.beginPath(); ctx.moveTo(parts[a].x,parts[a].y); ctx.lineTo(parts[b].x,parts[b].y); ctx.stroke(); }
      }
    }
    function anim(){ ctx.clearRect(0,0,canvas.width,canvas.height); parts.forEach(p=>{p.update();p.draw();}); connect(); requestAnimationFrame(anim); }
    init(); anim();

    const colors = ['#000000','#0066cc','#cc0000','#00aa00','#6600cc','#ffaa00'];
    let selectedColor = colors[0];
    const swDiv = document.getElementById('colorSwatches');
    colors.forEach(c => {
      const d = document.createElement('div'); d.className='swatch'; d.style.background=c;
      if(c===selectedColor) d.classList.add('selected');
      d.onclick = () => { selectedColor = c;
        document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
        d.classList.add('selected');
      };
      swDiv.appendChild(d);
    });

    const genBtn = document.getElementById('genBtn');
    const dlBtn = document.getElementById('dlBtn');
    const dlLink = dlBtn.querySelector('a');
    const qrDiv = document.getElementById('qrcode');
    const errDiv = document.getElementById('error');

    genBtn.onclick = () => {
      const url = document.getElementById('urlInput').value.trim();
      const size = parseInt(document.getElementById('qrSize').value);
      qrDiv.innerHTML = ''; errDiv.textContent = '';
      if (!/^https?:\/\//i.test(url)) { errDiv.textContent = 'Enter valid URL (http:// or https://)'; return; }
      QRCode.toDataURL(url, { width: size, margin: 2, color: { dark: selectedColor, light:"#ffffff" } },
        (err, dataUrl) => {
          if (err) { errDiv.textContent = 'Failed to generate.'; return; }
          const img = new Image(); img.src = dataUrl; img.alt='QR Code';
          qrDiv.appendChild(img);
          dlBtn.style.display = 'block';
          dlLink.href = dataUrl;
        });
    };
  </script>
</body>
